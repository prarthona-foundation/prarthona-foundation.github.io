[home_mission_title]
other = "Unsere Mission"

[home_mission_body]
other = "Prarthona i. G. unterstützt begabte Studierende aus finanziell benachteiligten Verhältnissen sowie aus marginalisierten religiösen Minderheiten in Bangladesch mit Stipendien und einer langfristigen Betreuung. Wir übernehmen Studiengebühren und sonstige Hochschulkosten, weisen jedem Studierenden einen engagierten Mentor zu und begleiten ihn auf seinem Weg bis zum Abschluss. Wir sind davon überzeugt, dass Bildung der nachhaltigste Weg ist, um den Kreislauf der Armut zu durchbrechen, die Würde zu wahren und Führungskräfte hervorzubringen, die der Gesellschaft etwas zurückgeben."

[home_programs_title]
other = "Unsere Programme"

[home_programs_lede]
other = "Drei Bausteine, die zusammengehören — Förderung, Begleitung und Nachverfolgung."

[home_program_scholarship_title]
other = "Stipendienprogramm"

[home_program_scholarship_desc]
other = "Direkte finanzielle Unterstützung für Schul- und Studiengebühren, Bücher und Prüfungskosten — damit Geld nie der Grund ist, warum jemand die Ausbildung abbricht."

[home_program_mentorship_title]
other = "Mentoring"

[home_program_mentorship_desc]
other = "Jede und jeder Geförderte bekommt eine feste Mentorin oder einen Mentor: für Fächerwahl, Bewerbungen und all die praktischen Fragen, die sonst niemand beantwortet."

[home_program_review_title]
other = "Lernfortschritt im Blick"

[home_program_review_desc]
other = "Regelmäßige Gespräche zu Leistungen und Wohlbefinden — damit wir früh unterstützen können und nicht erst, wenn die Zeugnisse da sind."

