# ---------- Über uns ----------

[about_story_title]
other = "Unser Auftrag"

[about_vision_title]
other = "Vision"

[about_vision_desc]
other = "Eine Zukunft, in der das Potenzial eines Kindes darüber entscheidet, wie weit es kommt — nicht das Einkommen der Familie."

[about_mission_title]
other = "Mission"

[about_mission_desc]
other = "Talentierte Schülerinnen und Schüler aus einkommensschwachen Familien finanzieren, begleiten und bis zum Abschluss unterstützen."

[about_values_title]
other = "Unsere Werte"

[about_values_desc]
other = "Würde statt Mitleid. Verlässlichkeit statt einmaliger Gesten. Offenheit darüber, wofür wir Geld ausgeben und was wir erreichen."

[about_philosophy_title]
other = "Unser Verständnis"

[about_philosophy_quote]
other = "Bildung ist keine Wohltätigkeit. Sie ist Befähigung."

[about_philosophy_body]
other = "Wir sprechen nicht von Empfängern. Diese jungen Menschen haben sich ihren Platz erarbeitet — es fehlten nur die Mittel, ihn zu halten. Unsere Aufgabe ist es, ein finanzielles Hindernis zu beseitigen und danach nützlich zu bleiben. Nicht, Dank zu bekommen."

[about_how_title]
other = "Der Weg eines Stipendiums"

[about_how_lede]
other = "Jedes Stipendium durchläuft denselben Weg — von der Bewerbung bis zum Alumni-Netzwerk."

[about_step_application]
other = "Bewerbung"

[about_step_application_desc]
other = "Bewerbung mit Zeugnissen und einer kurzen Darstellung der finanziellen Lage."

[about_step_selection]
other = "Auswahl"

[about_step_selection_desc]
other = "Wir betrachten schulische Leistung und finanzielle Situation gemeinsam."

[about_step_award]
other = "Zusage"

[about_step_award_desc]
other = "Gebühren werden direkt gezahlt, eine Mentorin oder ein Mentor wird zugeordnet."

[about_step_review]
other = "Lernfortschritt"

[about_step_review_desc]
other = "Regelmäßige Gespräche über Ergebnisse und Wohlbefinden im Laufe des Jahres."

[about_step_graduation]
other = "Abschluss"

[about_step_graduation_desc]
other = "Die Förderung läuft bis zum Abschluss — nicht nur im ersten Jahr."

[about_step_alumni]
other = "Alumni"

[about_step_alumni_desc]
other = "Ehemalige bleiben verbunden — viele kommen als Mentor:innen zurück."

[about_team_title]
other = "Unser Team"

[about_team_exec_title]
other = "Vorstand"

[about_team_exec_desc]
other = "Verantwortlich für die laufenden Entscheidungen, die Auswahl der Stipendiat:innen und die Finanzen des Vereins nach deutschem Vereinsrecht."

[about_team_founding_title]
other = "Gründungsmitglieder"

[about_team_founding_desc]
other = "Die Menschen, die den Verein gegründet und seinen Zweck festgelegt haben — und die seine Ausrichtung weiterhin prägen."

[about_team_volunteers_title]
other = "Ehrenamtliche"

[about_team_volunteers_desc]
other = "Mentor:innen und Helfer:innen, die ihre Zeit einbringen. Niemand im Verein bezieht ein Gehalt aus Spenden."

[about_gov_title]
other = "Transparenz und Verantwortung"

[about_gov_transparency_title]
other = "Transparenz"

[about_gov_transparency_desc]
other = "Wir legen offen, was wir fördern und wie viele Schülerinnen und Schüler wir unterstützen. Wer spendet, kann nachfragen, wohin das Geld geflossen ist — und bekommt eine klare Antwort."

[about_gov_financial_title]
other = "Finanzielle Rechenschaft"

[about_gov_financial_desc]
other = "Wir führen ordentliche Bücher. Die Mittel werden ausschließlich für den in der Satzung festgelegten Zweck verwendet. Prarthona i. G. befindet sich derzeit im Verfahren der Eintragung als gemeinnütziger Verein nach deutschem Recht."

# ---------- Spenden ----------

[donate_why_title]
other = "Warum spenden"

[donate_why_quote]
other = "Bildung verändert Leben."

[donate_why_body]
other = "Ein Stipendium endet nicht bei einem Kind. Es verändert, was eine Familie für möglich hält — und wem das nächste Kind in diesem Haushalt beim Aufwachsen zusieht. Wir halten unsere Zahlen bewusst klein, damit jede Spende einem konkreten Menschen und einem realen Kostenpunkt zugeordnet werden kann."

[donate_helps_title]
