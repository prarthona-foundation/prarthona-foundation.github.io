[donate_faq_title]
other = "Häufige Fragen"

[donate_faq_tax_q]
other = "Ist meine Spende steuerlich absetzbar?"

[donate_faq_tax_a]
other = "Noch nicht. Prarthona i. G. befindet sich derzeit im Eintragungsverfahren als gemeinnütziger e.V.; die Anerkennung der Gemeinnützigkeit durch das Finanzamt steht noch aus. Solange das nicht bestätigt ist, können wir keine Zuwendungsbestätigungen für die Steuererklärung ausstellen — das sagen wir lieber klar, als etwas anderes anzudeuten. Sobald der Status vorliegt, aktualisieren wir diese Seite."

[donate_faq_receipt_q]
other = "Erhalte ich eine Spendenquittung?"

[donate_faq_receipt_a]
other = "Ja. Wir stellen eine Zuwendungsbestätigung für Ihre Steuererklärung aus. Bei kleineren Beträgen genügt dem Finanzamt in der Regel der Kontoauszug als Nachweis. Wenn Sie eine Bestätigung wünschen, geben Sie bitte Name und Anschrift bei der Spende an oder melden Sie sich im Nachhinein bei uns."

[donate_faq_contact_q]
other = "Kann ich bestimmen, wofür meine Spende verwendet wird?"

[donate_faq_contact_a]
other = "Ja. Wenn Sie ein bestimmtes Programm oder ein ganzes Stipendium fördern möchten, sprechen Sie uns an — wir richten das ein."

