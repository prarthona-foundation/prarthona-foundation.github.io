[donate_transparency_title]
other = "Transparenz"

[donate_transparency_body]
other = "Spenden finanzieren Schul- und Studiengebühren, Lernmaterial und die direkten Kosten unserer Stipendien- und Mentoringarbeit. Die Mitglieder des Vorstands arbeiten ehrenamtlich. Alle Bewerbungen werden nach denselben zwei Kriterien geprüft — schulische Leistung und finanzielle Bedürftigkeit. Wer ein Stipendium finanziert, erfährt, wie sich die geförderte Person entwickelt."

