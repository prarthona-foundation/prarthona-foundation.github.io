[home_hero_headline]
other = "Träume verwirklichen durch Bildung"

[home_hero_subheading]
other = "Es handelt sich um eine von der Gemeinschaft getragene Initiative, die Schüler aus benachteiligten hinduistischen Minderheitengemeinschaften in Bangladesch unterstützt. Das Ziel besteht darin, ihnen zu einer guten Ausbildung, Selbstständigkeit und einer aktiven Rolle in der Gesellschaft zu verhelfen."

