[home_mission_title]
other = "Our Mission"

[home_mission_body]
other = "Prarthona i. G. empowers talented students from financially disadvantaged backgrounds and marginalized religious minorities in Bangladesh by providing scholarships, long-term mentorship, and continuous guidance. We fund tuition and university fees, pair each student with a dedicated mentor, and follow their journey until graduation. We believe education is the most sustainable path to breaking the cycle of poverty, safeguarding dignity, and creating leaders who give back to society."

