[donate_faq_title]
other = "Frequently Asked Questions"

[donate_faq_tax_q]
other = "Is my donation tax-deductible?"

[donate_faq_tax_a]
other = "Not yet. Prarthona i. G. is in the process of being registered as a tax-exempt non-profit association (gemeinnütziger e.V.), and recognition by the tax office is still pending. Until that is confirmed we cannot issue donation receipts for tax purposes, and we would rather say so plainly than imply otherwise. We will update this page as soon as the status is granted."

[donate_faq_receipt_q]
other = "Will I receive a donation receipt?"

[donate_faq_receipt_a]
other = "Yes. We issue a donation receipt (Zuwendungsbestätigung) for your tax return. For smaller donations, German tax rules often accept your bank statement as proof instead. If you would like a receipt, send us your name and postal address with your donation, or contact us afterwards."

[donate_faq_contact_q]
other = "Can I choose what my donation supports?"

[donate_faq_contact_a]
other = "Yes. If you would like your donation to go toward a specific programme, or to fund a full scholarship, get in touch and we will arrange it."

