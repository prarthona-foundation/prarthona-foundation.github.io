[home_program_scholarship_desc]
other = "Direct financial support for school and university fees, books, and exam costs, so that money is never the reason a capable student stops studying."

[home_program_mentorship_title]
other = "Mentorship"

[home_program_mentorship_desc]
other = "Every student is paired with a mentor for guidance on subject choices, applications, and the practical questions a first-generation student has no one else to ask."

[home_program_review_title]
other = "Student Progress Review"

[home_program_review_desc]
other = "Regular check-ins on academic progress and wellbeing, so we can step in early when a student is struggling rather than after the results arrive."

