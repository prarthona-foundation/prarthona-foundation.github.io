# ---------- About page ----------

[about_story_title]
other = "Our Purpose"

[about_vision_title]
other = "Vision"

[about_vision_desc]
other = "A future where a student's potential, not their family's income, decides how far they go."

[about_mission_title]
other = "Mission"

[about_mission_desc]
other = "To fund, mentor, and stay alongside talented students from low-income families until they graduate."

[about_values_title]
other = "Core Values"

[about_values_desc]
other = "Dignity over pity. Consistency over one-off gestures. Openness about what we spend and what we achieve."

[about_philosophy_title]
other = "Our Philosophy"

[about_philosophy_quote]
other = "Education is not charity. It is empowerment."

[about_philosophy_body]
other = "We do not describe our students as recipients. They earned their place; what they lacked was the means to keep it. Our role is to remove a financial obstacle and then stay useful — not to be thanked."

