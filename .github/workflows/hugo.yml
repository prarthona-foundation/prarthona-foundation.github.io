name: Build and deploy to gh-pages

# Pages is configured as "Deploy from a branch" -> gh-pages -> / (root).
# This workflow rebuilds the site on every push to main and force-pushes
# the generated output to the gh-pages branch, which GitHub then serves.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Needs write access to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      BASE_URL: https://prarthona-foundation.github.io/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify --baseURL "${BASE_URL}"

      # Stops GitHub Pages from running the output through Jekyll.
      - name: Add .nojekyll
        run: touch ./public/.nojekyll

      - name: Publish to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from main"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
