# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "avocado"
defaultAppearance = "light"
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = false

disableImageOptimization = false
defaultBackgroundImage = "/img/background.svg"

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"

# Numbers shown in the "Our Impact" section of the homepage.
[impact]
  active = 3
  scholarships = 6
  graduated = 2
  years = 4

# Executive committee, shown on the About page under "Our Team".
# `role` must match an about_role_* key in i18n/en.toml and i18n/de.toml.
[[team]]
  name = "Taposhi Roy"
  role = "president"

[[team]]
  name = "Bishwajit Gosswami"
  role = "general_secretary"

[[team]]
  name = "Alfred Bhowmick"
  role = "treasurer"

# Contact details, shown on the Contact page and in the Legal Notice.
[contact]
  email = "prarthona.foundation@gmail.com"
  street = "Glogauer Str. 10b"
  city = "90579 Langenzenn"
  country = "Germany"

# Donation details.
#
# IMPORTANT: fill in the real values before publishing. Anything left
# empty is shown on the Donate page as "To be added" rather than a
# made-up value — never put a placeholder IBAN here.
[donate]
  accountHolder = ""
  iban = ""
  bic = ""
  bankName = ""
  paypalURL = ""
  onlineURL = ""

[article]
  showDate = true
  showAuthor = false
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = true
  showReadingTime = false
  showTableOfContents = true
  showRelatedContent = false

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  groupByYear = true

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true
